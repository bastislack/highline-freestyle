description: You drop to Rocket slightly off-centered such that you can get some
  momentum by swinging to one side. From there you use the momentum to swing
  your legs to the other side and all the way up to hook the line with both feet
  (the Bat-Hang position), you let go with your hands and do a 360 below the
  line by regrabbing the line on the other side of your feet. Unhook your feet
  and land back in Rocket.
